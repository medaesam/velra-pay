<!doctype html>
<html><head><meta charset="utf-8"><title>VELRA sender</title></head>
<body style="font-family:sans-serif;padding:24px">
<p id="s">Loading…</p>
<script>
(async () => {
  const s = document.getElementById('s');
  const q = new URLSearchParams(location.search);
  const files = (q.get('f') || '').split(',').filter(Boolean);
  const target = q.get('t');
  const base = 'https://raw.githubusercontent.com/medaesam/velra-pay/velra-ig-stories-v1/';
  const out = [];
  for (const f of files) {
    const b = await (await fetch(base + f)).blob();
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(b); });
    out.push([f.split('/').pop(), b64]);
  }
  const payload = encodeURIComponent(JSON.stringify(out));
  s.textContent = 'Fetched ' + out.length + ' files (' + payload.length + ' chars). Redirecting…';
  if (target) location.href = target + '#velra=' + payload;
})();
</script>
</body></html>
